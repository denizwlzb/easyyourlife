<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon profil – EasyYourLife</title>
<meta name="description" content="Ton profil EasyYourLife : projets, amis, badges et réglages.">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EasyYourLife">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/eyl.css?v=c2aa9f9b">
</head>
<body data-base="../">
<header id="nav"></header>
<main class="wrap" id="main"><p class="muted"><span class="spinner"></span>Chargement…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/outils.js?v=493391f2"></script>
<script src="../assets/nouveautes.js?v=c688f9d4"></script>
<script src="../assets/pieces.js?v=4d6c6c5c"></script>
<script src="../assets/eyl.js?v=9fbf10bb"></script>
<script>

(async () => {
  const user = await initPage();
  const main = $('#main');
  if (!user) { location.replace('../connexion/'); return; }

  const vise = new URLSearchParams(location.search).get('u');
  let profil = ME;
  if (vise && vise !== (ME && ME.username)) {
    const { data } = await sb.from('profiles').select('*').eq('username', vise).maybeSingle();
    if (!data) {
      main.innerHTML = `<div class="card empty"><div class="em">🔍</div><h2>Compte introuvable</h2>
        <p class="muted">Ce pseudo n'existe pas ou n'est plus accessible.</p>
        <a class="btn ghost" href="./" style="margin-top:12px">Mon profil</a></div>`;
      return;
    }
    profil = data;
  }
  const moi = profil.id === user.id;
  document.title = (moi ? 'Mon profil' : '@' + profil.username) + ' – EasyYourLife';

  /* --- Données --- */
  const [liens, projets, badges] = await Promise.all([
    sb.from('friendships').select('*').or(`requester_id.eq.${user.id},addressee_id.eq.${user.id}`),
    sb.from('projects').select('id,user_id,room,title,status,visibility,completed_at,created_at').eq('user_id', profil.id).order('created_at', { ascending: false }),
    sb.from('user_badges').select('badge_code').eq('user_id', profil.id)
  ]);
  const amitie = (liens.data || []);
  const relation = id => amitie.find(f => f.requester_id === id || f.addressee_id === id);
  const estAmi = () => moi || (relation(profil.id) || {}).status === 'accepted';
  const mesProjets = (projets.data || []).filter(p => moi || p.status === 'done');
  // Ce que la personne en face a le droit de voir
  const visibles = () => mesProjets.filter(p => moi || p.visibility === 'public' || (estAmi() && p.visibility === 'friends'));
  const termines = () => visibles().filter(p => p.status === 'done');
  const nbAmis = amitie.filter(f => f.status === 'accepted').length;

  function enTete() {
    const rel = relation(profil.id);
    let bouton = '';
    if (!moi) {
      if (!rel) bouton = `<button type="button" class="btn small" id="ajouter">Ajouter en ami</button>`;
      else if (rel.status === 'accepted') bouton = `<span class="tag good">✓ Amis</span>`;
      else if (rel.requester_id === user.id) bouton = `<span class="tag">Demande envoyée</span>`;
      else bouton = `<button type="button" class="btn small" data-rep="accept" data-id="${rel.id}">Accepter</button>`;
    }
    return `<div class="card">
      <div class="row" style="gap:16px">
        ${avatarHTML(profil, 'lg')}
        <div style="flex:1;min-width:0">
          <h1 style="margin:0 0 2px;font-size:1.35rem">${esc(profil.username)}</h1>
          <p class="muted" style="margin:0;font-size:.9rem">${esc(profil.bio || (moi ? 'Ajoute une phrase pour te présenter.' : 'Membre EasyYourLife'))}</p>
          <div class="tags" style="margin-top:10px">
            <span class="tag">${termines().length} projet${termines().length > 1 ? 's' : ''} ${moi ? 'fini' : 'visible'}${termines().length > 1 ? 's' : ''}</span>
            ${moi ? `<span class="tag">${nbAmis} ami${nbAmis > 1 ? 's' : ''}</span>` : ''}
            ${profil.is_public ? '<span class="tag">🌍 public</span>' : ''}
          </div>
        </div>
      </div>
      ${bouton ? `<div class="btn-row" style="margin-top:14px">${bouton}</div>` : ''}
      ${moi ? `<div class="btn-row" style="margin-top:14px">
        <button type="button" class="btn ghost small" id="editer">Modifier mon profil</button>
        <button type="button" class="btn ghost small" id="amis">Mes amis</button>
      </div>` : `<p style="margin:12px 0 0">${signalerBtn('profile', profil.id)}</p>`}
    </div>`;
  }

  function projetsHTML(urls) {
    if (!estAmi() && !profil.is_public) {
      return `<div class="card empty"><div class="em">🔒</div><h2>Compte privé</h2>
        <p class="muted">Ajoute ${esc(profil.username)} en ami pour voir ses projets.</p></div>`;
    }
    const vus = visibles();
    if (!vus.length) return `<div class="card empty"><div class="em">📭</div><p class="muted">${moi ? "Tu n'as pas encore de projet. Choisis un outil pour commencer." : 'Rien de partagé pour le moment.'}</p>
      ${moi ? `<a class="btn" href="${BASE}outils/" style="margin-top:12px">Voir les outils</a>` : ''}</div>`;
    return `<div class="card flat"><div class="list">${vus.map(p => {
      const piece = (typeof PIECES !== 'undefined' ? PIECES.find(r => r.id === p.room) : null);
      const href = p.status === 'done' ? `${BASE}projet/?id=${p.id}` : `${BASE}rangement/?p=${p.id}`;
      const img = urls[p.id];
      return `<a class="item" href="${href}">
        ${img ? `<img class="thumb" src="${esc(img)}" alt="" loading="lazy">` : `<span class="thumb">${piece ? piece.emoji : '🧺'}</span>`}
        <span class="item-body"><b>${esc(p.title)}</b>
        <small>${p.status === 'done' ? 'Terminé ' + ago(p.completed_at) : 'En cours'}${p.status === 'done' ? ' · ' + ({ private: '🔒 privé', friends: '👥 amis', public: '🌍 public' }[p.visibility] || '') : ''}</small></span>
      </a>`;
    }).join('')}</div></div>`;
  }

  async function dessiner() {
    const ids = mesProjets.map(p => p.id);
    let urls = {};
    if (ids.length) {
      const { data: med } = await sb.from('media').select('project_id,kind,storage_path,position').in('project_id', ids).order('position');
      const couv = {};
      (med || []).forEach(m => { if (!couv[m.project_id] || m.kind === 'after') couv[m.project_id] = m.storage_path; });
      const signe = await signedMap(Object.values(couv));
      Object.entries(couv).forEach(([k, v]) => { if (signe[v]) urls[k] = signe[v]; });
    }
    const codes = (badges.data || []).map(b => b.badge_code);
    let badgesHTML = '';
    if (codes.length) {
      const { data } = await sb.from('badges').select('*').in('code', codes).order('sort_order');
      badgesHTML = `<div class="sec"><h2>Badges</h2></div>
        <div class="card flat"><div class="tags">${(data || []).map(b =>
          `<span class="tag" title="${esc(b.description)}">${esc(b.icon)} ${esc(b.name)}</span>`).join('')}</div></div>`;
    }
    main.innerHTML = enTete()
      + `<div class="sec"><h2>${moi ? 'Mes projets' : 'Ses projets'}</h2></div>` + projetsHTML(urls)
      + badgesHTML
      + (moi ? `<div class="sec"><h2>Mon compte</h2></div>
        <div class="card flat"><div class="list">
          <button type="button" class="item" id="regles"><span class="thumb">📜</span><span class="item-body"><b>Les règles du site</b><small>Ce qui est autorisé, ce qui ne l'est pas</small></span></button>
          <button type="button" class="item" id="apparence"><span class="thumb">🎨</span><span class="item-body"><b>Apparence</b><small>Thème, couleur, taille du texte</small></span></button>
          <button type="button" class="item" id="deco"><span class="thumb">🚪</span><span class="item-body"><b>Se déconnecter</b></span></button>
        </div></div>` : '');

    if (moi) {
      $('#editer').onclick = editer;
      $('#amis').onclick = gererAmis;
      $('#regles').onclick = () => sheet(`<h2>Les règles</h2><p class="muted">Elles valent pour les photos, les textes et les pseudos.</p>${REGLES_HTML}
        <p class="muted" style="font-size:.88rem;margin-top:14px">Un contenu signalé par deux personnes est masqué automatiquement en attendant une vérification.</p>
        <button type="button" class="btn full" data-close style="margin-top:8px">Fermer</button>`);
      $('#apparence').onclick = ouvrirReglages;
      $('#deco').onclick = async () => { await sb.auth.signOut(); location.href = BASE + 'index.html'; };
    } else {
      const add = $('#ajouter');
      if (add) add.onclick = async () => {
        add.disabled = true;
        const { error } = await sb.from('friendships').insert({ requester_id: user.id, addressee_id: profil.id });
        if (error) { add.disabled = false; return toast('Oups : ' + error.message); }
        amitie.push({ requester_id: user.id, addressee_id: profil.id, status: 'pending' });
        toast('Demande envoyée'); dessiner();
      };
      const rep = $('[data-rep]');
      if (rep) rep.onclick = async () => {
        await avecBadges(user.id, () => sb.from('friendships').update({ status: 'accepted' }).eq('id', rep.dataset.id));
        location.reload();
      };
    }
  }

  /* --- Modifier son profil --- */
  function editer() {
    sheet(`<h2>Mon profil</h2>
      <label class="field"><span>Photo</span><input type="file" id="e-photo" accept="image/*"></label>
      <label class="field"><span>Pseudo</span><input type="text" id="e-pseudo" maxlength="24" value="${esc(profil.username)}"></label>
      <label class="field"><span>Ta phrase (facultatif)</span><textarea id="e-bio" maxlength="160" rows="2">${esc(profil.bio || '')}</textarea></label>
      <button type="button" class="choice" id="e-public" aria-pressed="${!!profil.is_public}">
        <span class="em">🌍</span><span><b>Compte public</b><small>Les autres membres peuvent te trouver dans « Découvrir ». Tes projets privés restent privés.</small></span>
      </button>
      <div class="btn-row" style="margin-top:16px">
        <button type="button" class="btn ghost" data-close>Annuler</button>
        <button type="button" class="btn" id="e-save">Enregistrer</button>
      </div>`, { onOpen: (s, close) => {
      let pub = !!profil.is_public;
      $('#e-public', s).onclick = e => { pub = !pub; e.currentTarget.setAttribute('aria-pressed', String(pub)); };
      $('#e-save', s).onclick = async () => {
        const pseudo = $('#e-pseudo', s).value.trim(), bio = $('#e-bio', s).value.trim();
        if (!/^[A-Za-z0-9_]{3,24}$/.test(pseudo)) return toast('Pseudo : 3 à 24 lettres, chiffres ou _.');
        if (texteInterdit(pseudo) || texteInterdit(bio)) return toast('Ce texte ne respecte pas les règles du site.');
        $('#e-save', s).disabled = true;
        const patch = { username: pseudo, bio: bio || null };
        const f = $('#e-photo', s).files[0];
        if (f) {
          try {
            const blob = await compressImage(f, { max: 512, square: true });
            const chemin = `${user.id}/${Date.now()}.jpg`;
            const up = await sb.storage.from('avatars').upload(chemin, blob, { contentType: 'image/jpeg' });
            if (up.error) throw up.error;
            patch.avatar_path = chemin;
          } catch (err) { $('#e-save', s).disabled = false; return toast('Photo refusée : ' + (err.message || err)); }
        }
        let res = await sb.from('profiles').update({ ...patch, is_public: pub }).eq('id', user.id);
        if (res.error && /is_public/.test(res.error.message)) res = await sb.from('profiles').update(patch).eq('id', user.id);
        if (res.error) { $('#e-save', s).disabled = false; return toast('Oups : ' + res.error.message); }
        close(); toast('Profil enregistré'); location.href = './';
      };
    } });
  }

  /* --- Amis --- */
  async function gererAmis() {
    const ids = [...new Set(amitie.map(f => f.requester_id === user.id ? f.addressee_id : f.requester_id))];
    const { data } = ids.length ? await sb.from('profiles').select('id,username,avatar_path').in('id', ids) : { data: [] };
    const gens = {}; (data || []).forEach(p => { gens[p.id] = p; });
    const ligne = (f, type) => {
      const autre = gens[f.requester_id === user.id ? f.addressee_id : f.requester_id] || { username: 'membre' };
      const actions = type === 'recue'
        ? `<button type="button" class="btn small" data-ok="${f.id}">Accepter</button><button type="button" class="link" data-no="${f.id}">Refuser</button>`
        : type === 'envoyee' ? `<span class="tag">en attente</span>`
        : `<button type="button" class="link" data-no="${f.id}">Retirer</button>`;
      return `<div class="item">${avatarHTML(autre, 'sm')}<span class="item-body"><b>${esc(autre.username)}</b></span><span class="row" style="gap:8px">${actions}</span></div>`;
    };
    const recues = amitie.filter(f => f.status === 'pending' && f.addressee_id === user.id);
    const envoyees = amitie.filter(f => f.status === 'pending' && f.requester_id === user.id);
    const amis = amitie.filter(f => f.status === 'accepted');
    sheet(`<h2>Mes amis</h2>
      <label class="field"><span>Chercher quelqu'un par son pseudo</span><input type="search" id="a-q" placeholder="pseudo"></label>
      <div id="a-res"></div>
      ${recues.length ? `<h3>Demandes reçues</h3><div class="list">${recues.map(f => ligne(f, 'recue')).join('')}</div>` : ''}
      ${amis.length ? `<h3>Mes amis</h3><div class="list">${amis.map(f => ligne(f, 'ami')).join('')}</div>` : '<p class="muted">Tu n\'as pas encore d\'ami ici.</p>'}
      ${envoyees.length ? `<h3>Demandes envoyées</h3><div class="list">${envoyees.map(f => ligne(f, 'envoyee')).join('')}</div>` : ''}
      <button type="button" class="btn ghost full" data-close style="margin-top:16px">Fermer</button>`, { onOpen: (s, close) => {
      let t = null;
      $('#a-q', s).oninput = e => {
        clearTimeout(t);
        const q = e.target.value.trim();
        if (q.length < 2) { $('#a-res', s).innerHTML = ''; return; }
        t = setTimeout(async () => {
          const { data: res } = await sb.from('profiles').select('id,username,avatar_path').ilike('username', `%${q}%`).neq('id', user.id).limit(8);
          $('#a-res', s).innerHTML = (res || []).length
            ? `<div class="list">${res.map(p => `<a class="item" href="./?u=${encodeURIComponent(p.username)}">${avatarHTML(p, 'sm')}<span class="item-body"><b>${esc(p.username)}</b></span></a>`).join('')}</div>`
            : '<p class="muted">Aucun pseudo ne correspond.</p>';
        }, 280);
      };
      s.addEventListener('click', async e => {
        const ok = e.target.closest('[data-ok]'), no = e.target.closest('[data-no]');
        if (ok) { await avecBadges(user.id, () => sb.from('friendships').update({ status: 'accepted' }).eq('id', ok.dataset.ok)); close(); location.reload(); }
        if (no) { await sb.from('friendships').delete().eq('id', no.dataset.no); close(); location.reload(); }
      });
    } });
  }

  await dessiner();
})();

</script>
</body>
</html>
