<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le déclic du jour – EasyYourLife</title>
<meta name="description" content="Une découverte par jour, la même pour tout le monde, puis un débat ouvert dessus.">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EasyYourLife">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/eyl.css?v=c2aa9f9b">
</head>
<body data-base="../">
<header id="nav"></header>
<main class="wrap" id="main"><p class="muted"><span class="spinner"></span>Chargement…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/outils.js?v=493391f2"></script>
<script src="../assets/nouveautes.js?v=c688f9d4"></script>
<script src="../assets/lecons.js?v=bb569b03"></script>
<script src="../assets/eyl.js?v=9fbf10bb"></script>
<script>

(async () => {
  const user = await initPage();
  const main = $('#main');

  /* Le jour 0 est le 13 octobre 2026, heure de Paris : tout le monde voit la même chose. */
  const DEBUT = Date.UTC(2026, 9, 13), N = LECONS.length;
  const idx = k => ((k % N) + N) % N;
  const isoDuJour = k => new Date(DEBUT + k * 86400000).toISOString().slice(0, 10);
  const parisISO = (d = new Date()) => {
    const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit' })
      .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
    return `${p.year}-${p.month}-${p.day}`;
  };
  const aujourdhui = parisISO();
  const [ay, am, aj] = aujourdhui.split('-').map(Number);
  const n = Math.round((Date.UTC(ay, am - 1, aj) - DEBUT) / 86400000);
  const duJour = LECONS[idx(n)];

  const passees = [];
  for (let i = 1; i < N; i++) { const j = n - i; if (j < 0) break; passees.push({ l: LECONS[idx(j)], j }); }
  const dateCourte = j => new Date(DEBUT + j * 86400000).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', timeZone: 'UTC' });

  const voulue = new URLSearchParams(location.search).get('l');
  const choisie = voulue && [duJour, ...passees.map(p => p.l)].find(l => l.id === voulue);
  const vue = choisie || duJour;
  const cEstAujourdhui = vue.id === duJour.id;

  const serie = () => { let k = n, c = 0; const v = store.get('declics', {}); if (!v[isoDuJour(k)]) k--; while (v[isoDuJour(k)]) { c++; k--; } return c; };

  main.innerHTML = `
    <div class="tool-head" style="--h:265"><span class="em">💡</span>
      <div><h1 style="margin:0">Le déclic du jour</h1>
      <p class="muted" style="margin:0">Une découverte par jour, la même pour tout le monde.</p></div></div>
    <div class="tags" id="compteurs" style="margin-bottom:16px"></div>
    <div id="scene"></div>
    <div id="debat"></div>
    <div class="sec"><h2>Quand tu n'as rien à faire</h2></div>
    <div id="archive"></div>`;

  function compteurs() {
    const v = store.get('declics', {}), total = Object.keys(v).length, s = serie();
    $('#compteurs').innerHTML = total ? `<span class="tag">🔥 ${s} jour${s > 1 ? 's' : ''} d'affilée</span><span class="tag">📚 ${total} découverte${total > 1 ? 's' : ''}</span>` : '';
  }

  const corps = l => `
    <ul style="padding-left:1.15em;margin:0 0 16px">${l.points.map(p => `<li style="margin-bottom:9px">${esc(p)}</li>`).join('')}</ul>
    <div class="note"><span class="em">🎯</span><span><b>À essayer :</b> ${esc(l.essai)}</span></div>
    ${l.note ? `<p class="muted" style="font-size:.86rem">${esc(l.note)}</p>` : ''}`;

  function afficher(l, fete) {
    $('#scene').innerHTML = `
      ${cEstAujourdhui ? '' : `<div class="note"><span class="em">🕰️</span><span>Ancienne découverte. <a href="./">Revenir à celle du jour</a></span></div>`}
      <article class="card">
        <div class="tags" style="margin-bottom:12px"><span class="tag">${esc(l.cat)}</span><span class="tag">⏱️ ${esc(l.duree)}</span></div>
        <div style="font-size:2.6rem;line-height:1;margin-bottom:10px" aria-hidden="true">${l.emoji}</div>
        <h2>${esc(l.titre)}</h2>
        <p class="muted" style="font-size:1.05rem">${esc(l.accroche)}</p>
        ${corps(l)}
        <button type="button" class="btn ghost small" id="partager" style="margin-top:6px">Partager</button>
      </article>
      ${cEstAujourdhui ? '<p class="muted center" id="compte" style="margin-top:12px;font-size:.88rem"></p>' : ''}`;
    $('#partager').onclick = () => partager(l);
    if (fete) confetti();
    debat(l);
    if (cEstAujourdhui) tic();
  }

  async function partager(l) {
    const url = new URL(location.pathname + '?l=' + encodeURIComponent(l.id), location.origin).href;
    const texte = `${l.emoji} ${l.titre} : ${l.accroche}\nÀ débattre : « ${l.debat} »`;
    try {
      if (navigator.share) await navigator.share({ title: l.titre, text: texte, url });
      else { await navigator.clipboard.writeText(texte + '\n' + url); toast('Lien copié'); }
    } catch (e) { if (e && e.name !== 'AbortError') toast('Partage impossible pour le moment.'); }
  }

  function tic() {
    const el = $('#compte'); if (!el) return;
    const p = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: 'numeric', minute: 'numeric', second: 'numeric', hourCycle: 'h23' })
      .formatToParts(new Date()).reduce((a, x) => (a[x.type] = Number(x.value), a), {});
    const reste = 86400 - (p.hour * 3600 + p.minute * 60 + p.second);
    const z = v => String(v).padStart(2, '0');
    el.textContent = `Prochaine découverte dans ${z(Math.floor(reste / 3600))}:${z(Math.floor(reste % 3600 / 60))}:${z(reste % 60)}`;
    if (reste <= 1) return setTimeout(() => location.reload(), 1500);
    setTimeout(tic, 1000);
  }

  /* ---------- Le débat ---------- */
  async function debat(l) {
    const zone = $('#debat');
    zone.innerHTML = `<div class="sec"><h2>À débattre</h2></div>
      <div class="card"><p style="font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.25">« ${esc(l.debat)} »</p><div id="d-corps"></div></div>`;
    const box = $('#d-corps');
    if (!user) {
      box.innerHTML = `<p class="muted">Connecte-toi pour donner ton avis et lire ceux des autres.</p><a class="btn" href="${BASE}connexion/">Me connecter</a>`;
      return;
    }
    box.innerHTML = '<p class="muted"><span class="spinner"></span>Chargement…</p>';
    const { data, error } = await sb.from('daily_takes').select('*')
      .eq('lesson', l.id).order('created_at', { ascending: true }).limit(400);
    if (error) {
      box.innerHTML = `<p class="muted">Le débat ouvrira ici : tu pourras dire si tu es d'accord ou non, et répondre aux autres. En attendant, lance la discussion avec le bouton « Partager ».</p>`;
      return;
    }
    const lignes = (data || []).filter(r => !r.hidden);
    const avis = lignes.filter(r => !r.parent_id).reverse();
    const reponses = {};
    lignes.filter(r => r.parent_id).forEach(r => (reponses[r.parent_id] = reponses[r.parent_id] || []).push(r));
    const gens = {};
    const uids = [...new Set(lignes.map(r => r.user_id))];
    if (uids.length) {
      const { data: pr } = await sb.from('profiles').select('id,username,avatar_path').in('id', uids);
      (pr || []).forEach(p => { gens[p.id] = p; });
    }
    const qui = id => gens[id] || { username: 'membre' };
    const mien = avis.find(r => r.user_id === user.id);
    const oui = avis.filter(r => r.stance === 'pour').length, non = avis.filter(r => r.stance === 'contre').length, tot = oui + non;
    let position = mien ? mien.stance : null;

    const repHTML = r => { const p = qui(r.user_id);
      return `<div class="row" style="align-items:flex-start;gap:9px;margin:9px 0 0 16px;padding-left:10px;border-left:3px solid var(--line)">
        ${avatarHTML(p, 'sm')}<div style="flex:1;min-width:0"><b>${esc(p.username)}</b> <small class="muted">· ${ago(r.created_at)}</small>
        <p style="margin:4px 0">${esc(r.body)}</p>
        <small>${r.user_id === user.id ? `<button type="button" class="link" data-del="${r.id}">Supprimer</button>` : signalerBtn('take', r.id)}</small></div></div>`; };

    const avisHTML = r => { const p = qui(r.user_id), rs = reponses[r.id] || [], lien = `${BASE}profil/?u=${encodeURIComponent(p.username)}`;
      return `<article style="border-top:1px solid var(--line);padding:14px 0">
        <div class="row" style="margin-bottom:6px"><a href="${lien}">${avatarHTML(p, 'sm')}</a>
          <div style="flex:1;min-width:0"><a href="${lien}" style="text-decoration:none"><b>${esc(p.username)}</b></a>
          <span class="tag ${r.stance === 'pour' ? 'good' : 'bad'}">${r.stance === 'pour' ? "👍 d'accord" : "👎 pas d'accord"}</span>
          <small class="muted"> · ${ago(r.created_at)}</small></div></div>
        ${r.body ? `<p style="margin:6px 0">${esc(r.body)}</p>` : ''}
        <small><button type="button" class="link" data-rep="${r.id}">Répondre${rs.length ? ' (' + rs.length + ')' : ''}</button>
          · ${r.user_id === user.id ? `<button type="button" class="link" data-del="${r.id}">Supprimer</button>` : signalerBtn('take', r.id)}</small>
        ${rs.map(repHTML).join('')}
        <div class="row" style="margin:10px 0 0 16px" id="rb-${r.id}" hidden>
          <input type="text" maxlength="400" placeholder="Ta réponse…" aria-label="Ta réponse">
          <button type="button" class="btn small" data-env="${r.id}">Envoyer</button></div>
      </article>`; };

    box.innerHTML = `
      ${tot ? `<div style="display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:4px 0">
          <i style="width:${oui / tot * 100}%;background:var(--good)"></i><i style="width:${non / tot * 100}%;background:var(--bad)"></i></div>
        <p class="muted" style="font-size:.88rem">👍 ${oui} d'accord · 👎 ${non} pas d'accord</p>`
        : `<p class="muted">Personne n'a encore donné son avis. Lance-toi.</p>`}
      <div style="background:var(--surface-2);border-radius:var(--radius-sm);padding:14px;margin:14px 0">
        <b>${mien ? 'Ton avis' : 'Et toi, tu en penses quoi ?'}</b>
        <div class="row" style="gap:8px;margin:10px 0" id="pos">
          <button type="button" class="tag ${position === 'pour' ? 'on' : ''}" data-p="pour" aria-pressed="${position === 'pour'}">👍 D'accord</button>
          <button type="button" class="tag ${position === 'contre' ? 'on' : ''}" data-p="contre" aria-pressed="${position === 'contre'}">👎 Pas d'accord</button>
        </div>
        <textarea id="d-txt" maxlength="400" rows="3" placeholder="Ton argument en quelques mots (facultatif)">${esc(mien ? mien.body : '')}</textarea>
        <button type="button" class="btn small" id="d-go" style="margin-top:10px">${mien ? 'Mettre à jour' : 'Publier mon avis'}</button>
      </div>
      ${avis.map(avisHTML).join('')}`;

    $('#pos').onclick = e => {
      const b = e.target.closest('[data-p]'); if (!b) return;
      position = b.dataset.p;
      $$('#pos [data-p]').forEach(x => { const on = x === b; x.setAttribute('aria-pressed', String(on)); x.classList.toggle('on', on); });
    };
    $('#d-go').onclick = async () => {
      if (!position) return toast("Choisis d'abord : d'accord ou pas d'accord ?");
      const t = $('#d-txt').value.trim().slice(0, 400);
      if (bloqueSiInterdit(t)) return;
      const res = mien
        ? await sb.from('daily_takes').update({ stance: position, body: t }).eq('id', mien.id)
        : await sb.from('daily_takes').insert({ lesson: l.id, user_id: user.id, stance: position, body: t });
      if (res.error) return toast('Oups : ' + res.error.message);
      toast('Avis enregistré'); debat(l);
    };
    box.addEventListener('click', async e => {
      const rep = e.target.closest('[data-rep]'), env = e.target.closest('[data-env]'), del = e.target.closest('[data-del]');
      if (rep) { const b = $('#rb-' + rep.dataset.rep); b.hidden = !b.hidden; if (!b.hidden) $('input', b).focus(); }
      if (env) {
        const champ = $('input', env.parentElement), t = champ.value.trim().slice(0, 400);
        if (!t || bloqueSiInterdit(t)) return;
        const { error: er } = await sb.from('daily_takes').insert({ lesson: l.id, user_id: user.id, parent_id: env.dataset.env, body: t });
        if (er) return toast('Oups : ' + er.message);
        debat(l);
      }
      if (del) {
        const { error: er } = await sb.from('daily_takes').delete().eq('id', del.dataset.del);
        if (er) return toast('Oups : ' + er.message);
        debat(l);
      }
    });
  }

  /* ---------- Démarrage ---------- */
  compteurs();
  const dejaVu = (store.get('declics', {}))[aujourdhui] === duJour.id;
  if (!cEstAujourdhui || dejaVu) afficher(vue, false);
  else {
    $('#scene').innerHTML = `<div class="card empty">
      <div class="em">💡</div><h2>Ta découverte du jour t'attend</h2>
      <p class="muted">Une par jour, et tout le monde reçoit la même.</p>
      <button type="button" class="btn" id="ouvrir" style="margin-top:14px">Apprendre quelque chose</button></div>`;
    $('#ouvrir').onclick = () => {
      const v = store.get('declics', {}); v[aujourdhui] = duJour.id; store.set('declics', v);
      compteurs(); afficher(duJour, true);
    };
  }

  $('#archive').innerHTML = passees.length
    ? passees.map(({ l, j }) => `<details class="step"><summary><span class="num">${l.emoji}</span><span>${esc(l.titre)}</span></summary>
        <div class="inner"><p class="muted">${esc(dateCourte(j))} · ${esc(l.accroche)}</p>${corps(l)}
        <a class="btn ghost small" href="?l=${encodeURIComponent(l.id)}">Voir le débat</a></div></details>`).join('')
    : `<div class="card empty"><p class="muted">Les découvertes passées apparaîtront ici au fil des jours.</p></div>`;
})();

</script>
</body>
</html>
