<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projet – EasyYourLife</title>
<meta name="description" content="Un projet EasyYourLife : avant, après, et ce qui a été fait.">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EasyYourLife">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/eyl.css?v=c2aa9f9b">
</head>
<body data-base="../">
<header id="nav"></header>
<main class="wrap" id="main"><p class="muted"><span class="spinner"></span>Chargement…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/outils.js?v=493391f2"></script>
<script src="../assets/nouveautes.js?v=c688f9d4"></script>
<script src="../assets/pieces.js?v=4d6c6c5c"></script>
<script src="../assets/eyl.js?v=9fbf10bb"></script>
<script>

(async () => {
  const user = await initPage();
  const main = $('#main');
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { location.replace(BASE + 'index.html'); return; }

  const { data: p } = await sb.from('projects').select('*').eq('id', id).maybeSingle();
  if (!p) {
    main.innerHTML = `<div class="card empty"><div class="em">🙈</div><h2>Projet introuvable</h2>
      <p class="muted">Il a été supprimé, ou il n'est pas partagé avec toi.</p>
      <a class="btn ghost" href="${BASE}index.html" style="margin-top:12px">Retour à l'accueil</a></div>`;
    return;
  }
  const moi = user && p.user_id === user.id;
  document.title = p.title + ' – EasyYourLife';

  const [{ data: auteur }, { data: med }, { data: aimes }] = await Promise.all([
    sb.from('profiles').select('id,username,avatar_path').eq('id', p.user_id).maybeSingle(),
    sb.from('media').select('*').eq('project_id', p.id).order('position'),
    sb.from('likes').select('project_id,user_id').eq('project_id', p.id)
  ]);
  const qui = auteur || { username: 'membre' };
  const photos = med || [];
  const urls = await signedMap(photos.map(m => m.storage_path));
  const avant = photos.find(m => m.kind === 'before');
  const apres = photos.find(m => m.kind === 'after');
  const piece = pieceById(p.room);
  const nAimes = (aimes || []).length;
  let jAime = user ? (aimes || []).some(l => l.user_id === user.id) : false;

  const VIS = { private: ['🔒', 'Personne'], friends: ['👥', 'Mes amis'], public: ['🌍', 'Tous les membres'] };

  function dessiner() {
    const visuel = baHTML(avant && urls[avant.storage_path], apres && urls[apres.storage_path]);
    main.innerHTML = `
      <div class="row" style="margin-bottom:14px">
        <a href="${BASE}profil/?u=${encodeURIComponent(qui.username)}">${avatarHTML(qui)}</a>
        <div style="flex:1;min-width:0">
          <a href="${BASE}profil/?u=${encodeURIComponent(qui.username)}" style="text-decoration:none"><b>${esc(qui.username)}</b></a>
          <small class="muted" style="display:block">${piece ? piece.emoji + ' ' + esc(piece.nom) + ' · ' : ''}${p.completed_at ? ago(p.completed_at) : ''}</small>
        </div>
      </div>
      <h1>${esc(p.title)}</h1>
      ${visuel || `<div class="card empty"><div class="em">${piece ? piece.emoji : '🧺'}</div><p class="muted">Pas de photo pour ce projet.</p></div>`}
      ${p.caption ? `<p style="margin-top:14px">${esc(p.caption)}</p>` : ''}
      <div class="row wrapline" style="margin-top:14px;gap:10px">
        ${user ? `<button type="button" class="btn ghost small" id="aime" aria-pressed="${jAime}">${jAime ? '❤️' : '🤍'} <span id="n-aime">${nAimes + (jAime && !(aimes || []).some(l => l.user_id === user.id) ? 1 : 0)}</span></button>` : ''}
        ${moi ? `<button type="button" class="btn ghost small" id="reglages">Qui peut voir ?</button>` : ''}
        ${!moi && user ? signalerBtn('project', p.id) : ''}
      </div>
      ${moi ? `<p class="muted" style="margin-top:12px;font-size:.9rem">Visible par : ${VIS[p.visibility] ? VIS[p.visibility][0] + ' ' + VIS[p.visibility][1] : 'personne'}</p>
        <p style="margin-top:18px"><button type="button" class="link" id="suppr">Supprimer ce projet</button></p>` : ''}`;
    initBA(main);

    const a = $('#aime');
    if (a) a.onclick = async () => {
      const n = $('#n-aime');
      jAime = !jAime;
      a.setAttribute('aria-pressed', String(jAime));
      a.firstChild.textContent = jAime ? '❤️ ' : '🤍 ';
      n.textContent = Math.max(0, Number(n.textContent) + (jAime ? 1 : -1));
      const { error } = jAime
        ? await sb.from('likes').insert({ project_id: p.id, user_id: user.id })
        : await sb.from('likes').delete().eq('project_id', p.id).eq('user_id', user.id);
      if (error) toast('Oups : ' + error.message);
    };

    const r = $('#reglages');
    if (r) r.onclick = () => sheet(`<h2>Qui peut voir ce projet ?</h2>
      <div id="v-opts">${Object.entries(VIS).map(([k, [em, lab]]) =>
        `<button type="button" class="choice" data-v="${k}" aria-pressed="${p.visibility === k}"><span class="em">${em}</span><span><b>${esc(lab)}</b></span></button>`).join('')}</div>
      <button type="button" class="btn full" data-close>Terminé</button>`, { onOpen: s => {
        $('#v-opts', s).onclick = async e => {
          const b = e.target.closest('[data-v]'); if (!b) return;
          const { error } = await sb.from('projects').update({ visibility: b.dataset.v }).eq('id', p.id);
          if (error) return toast('Oups : ' + error.message);
          p.visibility = b.dataset.v;
          $$('#v-opts [data-v]', s).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
          toast('Enregistré'); dessiner();
        };
      } });

    const d = $('#suppr');
    if (d) d.onclick = () => sheet(`<h2>Supprimer ce projet ?</h2>
      <p class="muted">Le projet et ses photos seront effacés définitivement. Impossible de revenir en arrière.</p>
      <div class="btn-row"><button type="button" class="btn ghost" data-close>Annuler</button>
        <button type="button" class="btn danger" id="d-ok">Supprimer</button></div>`, { onOpen: s => {
        $('#d-ok', s).onclick = async () => {
          $('#d-ok', s).disabled = true;
          if (photos.length) await sb.storage.from('media').remove(photos.map(m => m.storage_path));
          const { error } = await sb.from('projects').delete().eq('id', p.id);
          if (error) { $('#d-ok', s).disabled = false; return toast('Oups : ' + error.message); }
          location.href = BASE + 'profil/';
        };
      } });
  }
  dessiner();
})();

</script>
</body>
</html>
