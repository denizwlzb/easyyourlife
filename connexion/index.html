<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Se connecter – EasyYourLife</title>
<meta name="description" content="Connexion et création de compte EasyYourLife.">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EasyYourLife">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/eyl.css?v=c2aa9f9b">
</head>
<body data-base="../">
<header id="nav"></header>
<main class="wrap" id="main"><p class="muted"><span class="spinner"></span>Chargement…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/outils.js?v=493391f2"></script>
<script src="../assets/nouveautes.js?v=c688f9d4"></script>
<script src="../assets/eyl.js?v=9fbf10bb"></script>
<script>

(async () => {
  const user = await initPage();
  if (user) { location.replace('../profil/'); return; }
  const main = $('#main');
  main.innerHTML = `<div class="card" style="max-width:440px;margin:0 auto">
    <h1 id="titre">Se connecter</h1>
    <div class="seg" role="tablist">
      <button type="button" id="s-login" aria-selected="true">Connexion</button>
      <button type="button" id="s-signup" aria-selected="false">Créer un compte</button>
    </div>
    <form id="form" novalidate>
      <label class="field" id="f-pseudo" hidden><span>Pseudo (3 à 24 lettres, chiffres ou _)</span>
        <input type="text" id="pseudo" autocomplete="username" maxlength="24"></label>
      <label class="field"><span>Email</span><input type="email" id="email" autocomplete="email" required></label>
      <label class="field"><span>Mot de passe (8 caractères minimum)</span>
        <input type="password" id="mdp" autocomplete="current-password" required minlength="8"></label>
      <button class="btn full" id="go" type="submit">Se connecter</button>
    </form>
    <p style="margin-top:14px"><button type="button" class="link" id="oubli">Mot de passe oublié ?</button></p>
    <div id="msg" class="msg" hidden></div>
  </div>
  <div class="note" style="max-width:440px;margin:16px auto 0"><span class="em">🔒</span>
    <span>Ton compte est privé par défaut : rien n'est visible tant que tu ne le décides pas.</span></div>`;

  let mode = 'login';
  const msg = $('#msg');
  const say = (t, err) => { msg.hidden = false; msg.className = 'msg' + (err ? ' err' : ''); msg.textContent = t; };
  const traduire = m =>
    /Invalid login credentials/i.test(m) ? 'Email ou mot de passe incorrect.' :
    /Email not confirmed/i.test(m) ? "Confirme d'abord ton email grâce au lien reçu." :
    /already registered|already been registered/i.test(m) ? 'Cet email a déjà un compte. Connecte-toi.' :
    /Password should be/i.test(m) ? 'Mot de passe trop court (8 caractères minimum).' :
    /rate limit/i.test(m) ? 'Trop de tentatives. Réessaie dans quelques minutes.' : m;

  function setMode(m) {
    mode = m;
    $('#s-login').setAttribute('aria-selected', String(m === 'login'));
    $('#s-signup').setAttribute('aria-selected', String(m === 'signup'));
    $('#f-pseudo').hidden = m !== 'signup';
    $('#titre').textContent = m === 'login' ? 'Se connecter' : 'Créer un compte';
    $('#go').textContent = m === 'login' ? 'Se connecter' : "Créer mon compte";
    $('#mdp').autocomplete = m === 'login' ? 'current-password' : 'new-password';
    msg.hidden = true;
  }
  $('#s-login').onclick = () => setMode('login');
  $('#s-signup').onclick = () => setMode('signup');

  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#email').value.trim(), mdp = $('#mdp').value, pseudo = $('#pseudo').value.trim();
    if (!email || mdp.length < 8) return say('Entre un email valide et un mot de passe de 8 caractères minimum.', true);
    $('#go').disabled = true;
    try {
      if (mode === 'signup') {
        if (!/^[A-Za-z0-9_]{3,24}$/.test(pseudo)) return say('Pseudo invalide : 3 à 24 caractères, lettres, chiffres ou _.', true);
        if (texteInterdit(pseudo)) return say('Ce pseudo ne respecte pas les règles du site.', true);
        const { data, error } = await sb.auth.signUp({ email, password: mdp,
          options: { data: { username: pseudo }, emailRedirectTo: new URL('../profil/', location.href).href } });
        if (error) return say(traduire(error.message), true);
        if (data.session) { location.href = '../profil/'; return; }
        say('Compte créé. Ouvre ta boîte mail, clique sur le lien de confirmation, puis reviens te connecter.');
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password: mdp });
        if (error) return say(traduire(error.message), true);
        location.href = '../profil/';
      }
    } finally { $('#go').disabled = false; }
  });

  $('#oubli').onclick = async () => {
    const email = $('#email').value.trim();
    if (!email) return say('Entre ton email au-dessus, puis réessaie.', true);
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: new URL('../profil/', location.href).href });
    if (error) return say(traduire(error.message), true);
    say('Si un compte existe pour cet email, un lien vient de partir.');
  };
})();

</script>
</body>
</html>
