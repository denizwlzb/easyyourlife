<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranger & décorer – EasyYourLife</title>
<meta name="description" content="Choisis une pièce ou laisse le hasard décider, suis un plan en étapes et garde ton avant/après.">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EasyYourLife">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/eyl.css?v=c2aa9f9b">
</head>
<body data-base="../">
<header id="nav"></header>
<main class="wrap" id="main"><p class="muted"><span class="spinner"></span>Chargement…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/outils.js?v=493391f2"></script>
<script src="../assets/nouveautes.js?v=c688f9d4"></script>
<script src="../assets/pieces.js?v=4d6c6c5c"></script>
<script src="../assets/eyl.js?v=9fbf10bb"></script>
<script>

(async () => {
  const user = await initPage();
  const main = $('#main');
  const params = new URLSearchParams(location.search);
  let projet = null;

  if (!user) {
    main.innerHTML = `<div class="tool-head" style="--h:28"><span class="em">🧺</span><div><h1 style="margin:0">Ranger & décorer</h1>
      <p class="muted" style="margin:0">Une pièce, un plan, un avant/après.</p></div></div>
      <div class="card"><p>Choisis une pièce — ou laisse le hasard décider — et reçois un plan en cinq étapes à cocher. Tes photos avant/après restent privées tant que tu ne décides pas de les montrer.</p>
      <a class="btn full" href="${BASE}connexion/" style="margin-top:10px">Créer mon compte pour commencer</a></div>
      <div class="sec"><h2>Les pièces</h2></div>
      <div class="tools">${PIECES.map(p => `<div class="tool" style="--h:28"><div class="em">${p.emoji}</div><b>${esc(p.nom)}</b><p>${esc(p.accroche)}</p></div>`).join('')}</div>`;
    return;
  }

  const id = params.get('p');
  if (id) {
    const { data } = await sb.from('projects').select('*').eq('id', id).maybeSingle();
    if (data && data.user_id === user.id) projet = data;
  }

  /* ================= Choix de la pièce ================= */
  function ecranChoix() {
    main.innerHTML = `
      <div class="tool-head" style="--h:28"><span class="em">🧺</span><div><h1 style="margin:0">Ranger & décorer</h1>
        <p class="muted" style="margin:0">Choisis une pièce, ou laisse le hasard.</p></div></div>
      <div class="card" style="margin-bottom:18px">
        <h2 style="margin-top:0">Tu ne sais pas par où commencer ?</h2>
        <p class="muted">On te tire une pièce au sort, et tu t'y mets pendant vingt minutes.</p>
        <button type="button" class="btn full" id="hasard">🎲 Une pièce au hasard</button>
      </div>
      <div class="sec"><h2>Ou choisis toi-même</h2></div>
      <div class="tools" id="pieces">${PIECES.map(p =>
        `<div class="tool" style="--h:28"><button type="button" data-piece="${p.id}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;gap:7px">
          <span class="em">${p.emoji}</span><b>${esc(p.nom)}</b><p>${esc(p.accroche)}</p></button></div>`).join('')}</div>
      <div id="encours"></div>`;

    $('#hasard').onclick = () => {
      const p = pieceAuHasard(store.get('derniere-piece'));
      const b = $('#hasard');
      b.disabled = true; b.textContent = '🎲 …';
      setTimeout(() => { store.set('derniere-piece', p.id); demarrer(p, true); }, 420);
    };
    $('#pieces').onclick = e => {
      const b = e.target.closest('[data-piece]'); if (!b) return;
      demarrer(pieceById(b.dataset.piece), false);
    };
    listerEnCours();
  }

  async function listerEnCours() {
    const { data } = await sb.from('projects').select('id,room,title,status,created_at')
      .eq('user_id', user.id).order('created_at', { ascending: false }).limit(10);
    const liste = data || [];
    if (!liste.length) return;
    $('#encours').innerHTML = `<div class="sec"><h2>Tes pièces</h2></div>
      <div class="card flat"><div class="list">${liste.map(p => {
        const piece = pieceById(p.room);
        return `<a class="item" href="${p.status === 'done' ? BASE + 'projet/?id=' + p.id : './?p=' + p.id}">
          <span class="thumb">${piece ? piece.emoji : '🧺'}</span>
          <span class="item-body"><b>${esc(p.title)}</b><small>${p.status === 'done' ? 'Terminé' : 'En cours'} · ${ago(p.created_at)}</small></span></a>`;
      }).join('')}</div></div>`;
  }

  /* ================= Démarrer ================= */
  function demarrer(piece, auHasard) {
    main.innerHTML = `<div class="card">
      ${auHasard ? `<p class="tag on" style="margin-bottom:10px">🎲 Le sort a parlé</p>` : ''}
      <div class="tool-head" style="--h:28"><span class="em">${piece.emoji}</span>
        <div><h1 style="margin:0;font-size:1.4rem">${esc(piece.nom)}</h1><p class="muted" style="margin:0">${esc(piece.accroche)}</p></div></div>
      <h3 style="margin-top:18px">Qu'est-ce qui te gêne le plus ?</h3>
      <p class="muted" style="font-size:.9rem">Facultatif. Ce que tu coches passe en premier dans le plan.</p>
      <div id="soucis">${SOUCIS.map(s =>
        `<button type="button" class="choice" data-s="${s.id}" aria-pressed="false"><span class="em">•</span><span><b>${esc(s.label)}</b></span></button>`).join('')}</div>
      <div class="btn-row" style="margin-top:18px">
        ${auHasard ? `<button type="button" class="btn ghost" id="relancer">🎲 Une autre</button>` : `<button type="button" class="btn ghost" id="retour">Retour</button>`}
        <button type="button" class="btn" id="go">Voir mon plan</button>
      </div></div>`;
    const choisis = new Set();
    $('#soucis').onclick = e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      const on = !choisis.has(b.dataset.s);
      on ? choisis.add(b.dataset.s) : choisis.delete(b.dataset.s);
      b.setAttribute('aria-pressed', String(on));
      $('.em', b).textContent = on ? '✓' : '•';
    };
    const r = $('#retour'); if (r) r.onclick = ecranChoix;
    const re = $('#relancer'); if (re) re.onclick = () => { const p = pieceAuHasard(piece.id); store.set('derniere-piece', p.id); demarrer(p, true); };
    $('#go').onclick = async () => {
      $('#go').disabled = true;
      const brief = { problems: [...choisis] };
      const plan = construirePlan(piece.id, brief);
      const { data, error } = await sb.from('projects').insert({
        user_id: user.id, room: piece.id, title: piece.nom, tool: 'rangement',
        status: 'planned', visibility: 'private', brief, plan, plan_source: 'classique',
        plan_at: new Date().toISOString(), progress: { checked: {} }
      }).select().maybeSingle();
      if (error) { $('#go').disabled = false; return toast('Oups : ' + error.message); }
      projet = data;
      history.replaceState(null, '', './?p=' + data.id);
      ecranPlan();
    };
  }

  /* ================= Le plan ================= */
  async function ecranPlan() {
    const piece = pieceById(projet.room) || PIECES[0];
    const plan = projet.plan || construirePlan(projet.room, projet.brief || {});
    const coches = (projet.progress && projet.progress.checked) || {};
    const total = plan.etapes.reduce((s, e) => s + e.taches.length, 0);
    const faits = Object.keys(coches).filter(k => coches[k]).length;

    const { data: med } = await sb.from('media').select('*').eq('project_id', projet.id).order('position');
    const photos = med || [];
    const urls = await signedMap(photos.map(m => m.storage_path));
    const avant = photos.find(m => m.kind === 'before');

    main.innerHTML = `
      <div class="row spread" style="margin-bottom:12px">
        <div class="row"><span style="font-size:1.6rem">${piece.emoji}</span><h1 style="margin:0;font-size:1.3rem">${esc(projet.title)}</h1></div>
        <a class="link" href="./">Mes pièces</a>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div class="row spread" style="margin-bottom:8px"><b>${faits} / ${total} tâches</b><span class="tag">${Math.round(faits / total * 100)} %</span></div>
        <div class="bar"><i style="width:${Math.round(faits / total * 100)}%"></i></div>
        <p class="muted" style="margin:10px 0 0;font-size:.9rem">${esc(plan.resume)}</p>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h3 style="margin-top:0">Photo « avant »</h3>
        ${avant && urls[avant.storage_path]
          ? `<img src="${esc(urls[avant.storage_path])}" alt="Avant" style="border-radius:var(--radius-sm);margin-bottom:10px">`
          : `<p class="muted" style="font-size:.9rem">Facultatif, mais c'est ce qui rend l'avant/après satisfaisant.</p>`}
        <label class="btn ghost small" style="display:inline-flex">
          ${avant ? 'Remplacer la photo' : 'Prendre la photo avant'}
          <input type="file" id="f-avant" accept="image/*" hidden>
        </label>
      </div>

      <div class="sec"><h2>Le plan</h2></div>
      <div id="etapes">${plan.etapes.map((e, i) => {
        const n = e.taches.filter((_, j) => coches[i + '-' + j]).length;
        return `<details class="step ${n === e.taches.length ? 'done' : ''}" ${i === 0 ? 'open' : ''}>
          <summary><span class="num">${n === e.taches.length ? '✓' : i + 1}</span><span>${esc(e.titre)}</span></summary>
          <div class="inner">${e.taches.map((t, j) => `
            <label class="check"><input type="checkbox" data-k="${i}-${j}" ${coches[i + '-' + j] ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
          </div></details>`;
      }).join('')}</div>

      ${plan.deco && plan.deco.length ? `<div class="sec"><h2>Déco pas chère</h2></div>
        <div class="card flat"><div class="list">${plan.deco.map(d =>
          `<div class="item"><span class="thumb">✨</span><span class="item-body"><b>${esc(d.nom)}</b><small>${esc(d.budget || d.cout || '')} · ${esc(d.desc)}</small></span></div>`).join('')}</div></div>` : ''}

      <div class="card" style="margin-top:18px">
        <h3 style="margin-top:0">Quand tu as fini</h3>
        <p class="muted" style="font-size:.9rem">Prends la photo « après » et choisis qui peut la voir. Par défaut, personne.</p>
        <button type="button" class="btn full" id="finir">Terminer la pièce</button>
      </div>`;

    $('#etapes').addEventListener('change', async e => {
      const c = e.target.closest('[data-k]'); if (!c) return;
      coches[c.dataset.k] = c.checked;
      if (!c.checked) delete coches[c.dataset.k];
      projet.progress = { checked: coches };
      await sb.from('projects').update({ progress: projet.progress }).eq('id', projet.id);
      ecranPlan();
    });

    $('#f-avant').onchange = e => envoyerPhoto(e.target.files[0], 'before');
    $('#finir').onclick = terminer;
  }

  async function envoyerPhoto(file, kind) {
    if (!file) return;
    if (!await demanderAccordRegles()) return;
    toast('Envoi de la photo…', 8000);
    try {
      const blob = await compressImage(file, { max: 1400 });
      const chemin = `${user.id}/${projet.id}/${kind}-${Date.now()}.jpg`;
      const up = await sb.storage.from('media').upload(chemin, blob, { contentType: 'image/jpeg' });
      if (up.error) throw up.error;
      const ancienne = await sb.from('media').select('id,storage_path').eq('project_id', projet.id).eq('kind', kind);
      const { error } = await sb.from('media').insert({
        project_id: projet.id, user_id: user.id, tool: 'rangement', kind, storage_path: chemin, position: 0
      });
      if (error) throw error;
      for (const m of (ancienne.data || [])) {
        await sb.from('media').delete().eq('id', m.id);
        await sb.storage.from('media').remove([m.storage_path]);
      }
      toast('Photo enregistrée ✅');
      return true;
    } catch (err) { toast('Photo refusée : ' + (err.message || err)); return false; }
  }

  /* ================= Terminer ================= */
  function terminer() {
    sheet(`<h2>Terminer « ${esc(projet.title)} »</h2>
      <label class="field"><span>Photo « après » (facultatif)</span><input type="file" id="t-photo" accept="image/*"></label>
      <label class="field"><span>Une phrase sur ce que tu as fait (facultatif)</span>
        <textarea id="t-cap" maxlength="200" rows="2" placeholder="Enfin un bureau dégagé…"></textarea></label>
      <h3>Qui peut voir cette pièce ?</h3>
      <div id="t-vis">
        <button type="button" class="choice" data-v="private" aria-pressed="true"><span class="em">🔒</span><span><b>Personne</b><small>Tu es la seule personne à la voir</small></span></button>
        <button type="button" class="choice" data-v="friends" aria-pressed="false"><span class="em">👥</span><span><b>Mes amis</b><small>Sur ton profil et dans leur fil</small></span></button>
        <button type="button" class="choice" data-v="public" aria-pressed="false"><span class="em">🌍</span><span><b>Tous les membres</b><small>Visible aussi dans « Découvrir »</small></span></button>
      </div>
      <div class="note"><span class="em">📜</span><span>Photos de ton logement uniquement. Pas de visage, pas de contenu choquant.</span></div>
      <div class="btn-row">
        <button type="button" class="btn ghost" data-close>Pas encore</button>
        <button type="button" class="btn" id="t-go">C'est fini</button>
      </div>`, { onOpen: (s, close) => {
      let vis = 'private';
      $('#t-vis', s).onclick = e => {
        const b = e.target.closest('[data-v]'); if (!b) return;
        vis = b.dataset.v;
        $$('#t-vis [data-v]', s).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      };
      $('#t-go', s).onclick = async () => {
        const cap = $('#t-cap', s).value.trim();
        if (bloqueSiInterdit(cap)) return;
        $('#t-go', s).disabled = true;
        const f = $('#t-photo', s).files[0];
        if (f) { const ok = await envoyerPhoto(f, 'after'); if (!ok) { $('#t-go', s).disabled = false; return; } }
        const { error } = await sb.from('projects').update({
          status: 'done', visibility: vis, caption: cap || null, completed_at: new Date().toISOString()
        }).eq('id', projet.id);
        if (error) { $('#t-go', s).disabled = false; return toast('Oups : ' + error.message); }
        await avecBadges(user.id, async () => ({}));
        close(); confetti();
        setTimeout(() => { location.href = BASE + 'projet/?id=' + projet.id; }, 700);
      };
    } });
  }

  projet ? ecranPlan() : ecranChoix();
})();

</script>
</body>
</html>
